bsp.settings.filter = Threat filter:

setting.bsp.enabled.name = Enabled
setting.bsp.enabled.description = Master switch. Off stops all drawing, hotkeys and automatic behavior.
setting.bsp.toasts.name = Show toasts
setting.bsp.toasts.description = Mode switches, no-path hints and other small popups.
setting.bsp.debugLog.name = F8 console debug log
setting.bsp.debugLog.description = Detailed logs for planning, auto mode, commands and drowning.
setting.bsp.proMode.name = Pro mode
setting.bsp.proMode.description = Unlocks the advanced settings section.
setting.bsp.shortestOnly.name = Always plan shortest path
setting.bsp.shortestOnly.description = Ignore damage and always take the shortest route.
setting.bsp.slowestBaseline.name = Use slowest unit as baseline
setting.bsp.slowestBaseline.description = Estimate travel time and damage using the slowest unit of the formation.
setting.bsp.floorSlowdown.name = Count floor slowdown
setting.bsp.floorSlowdown.description = Water/cryo slow-down enters the speed estimate.
setting.bsp.survivableLiquid.name = Allow survivable liquid crossing
setting.bsp.survivableLiquid.description = Deep water may be crossed when the whole formation provably survives it.
setting.bsp.caution.name = Route style
setting.bsp.caution.description = How hard routes detour around danger: reckless favors speed, cautious favors safety.

bsp.caution.reckless = Reckless
bsp.caution.balanced = Balanced
bsp.caution.cautious = Cautious
bsp.keep.forever = keep

setting.bsp.win.mode.name = Mode window
setting.bsp.win.mode.description = Shows the current path mode and threat filter.
setting.bsp.win.damage.name = Damage window
setting.bsp.win.damage.description = Shows the expected damage of the current route.
setting.bsp.win.control.name = Control window
setting.bsp.win.control.description = Quick buttons for preview / auto / mode / filter.

setting.bsp.keepSeconds.name = Route display seconds
setting.bsp.keepSeconds.description = How long routes stay visible after release. 0 keeps them until the next calculation.
setting.bsp.lineWidth.name = Line width
setting.bsp.lineWidth.description = Thickness of drawn route lines.
setting.bsp.lineAlpha.name = Route opacity
setting.bsp.lineAlpha.description = Opacity of drawn route lines.
setting.bsp.showEnds.name = Show endpoints
setting.bsp.showEnds.description = Draw start/end dots on the route.
setting.bsp.startDotScale.name = Start dot size
setting.bsp.startDotScale.description = Start dot size relative to line width.
setting.bsp.endDotScale.name = End dot size
setting.bsp.endDotScale.description = End dot size relative to line width.
setting.bsp.showDamageText.name = Show damage text
setting.bsp.showDamageText.description = Estimated damage label on the route.
setting.bsp.damageTextScale.name = Damage text scale
setting.bsp.damageTextScale.description = Font scale of the damage label.
setting.bsp.damageAtEnd.name = Damage text at end
setting.bsp.damageAtEnd.description = Put the label at the route end instead of the middle.
setting.bsp.damageOffset.name = Damage text offset
setting.bsp.damageOffset.description = Vertical offset of the damage label.
setting.bsp.previewInterval.name = Preview refresh interval
setting.bsp.previewInterval.description = Replan interval while holding a preview key.

setting.bsp.color.power.name = Power cluster route color
setting.bsp.color.mouse.name = Player-to-cursor route color
setting.bsp.color.safe.name = Auto safe color
setting.bsp.color.warn.name = Auto warning color
setting.bsp.color.fatal.name = Auto fatal color

setting.bsp.auto.safeThreshold.name = Auto safe damage threshold
setting.bsp.auto.safeThreshold.description = Expected damage below this counts as safe (green).
setting.bsp.autoMove.name = Automatic move commands
setting.bsp.autoMove.description = In auto mode, send native move commands along the planned route.
setting.bsp.resendInterval.name = Command resend interval
setting.bsp.resendInterval.description = Minimum time between full-route resends.
setting.bsp.packetInterval.name = Command packet interval
setting.bsp.packetInterval.description = Extra spacing between individual waypoint packets.
setting.bsp.arriveRadius.name = Waypoint arrival radius
setting.bsp.arriveRadius.description = Units this close to a waypoint advance to the next one.
setting.bsp.spreadTicks.name = Auto planning spread
setting.bsp.spreadTicks.description = Spread auto-mode planning work over this many ticks.
setting.bsp.threatExpand.name = Auto risk relaxation
setting.bsp.threatExpand.description = How far risk tolerance may relax when no safe route exists.

setting.bsp.power.maxRoutes.name = Power routes drawn
setting.bsp.power.maxRoutes.description = Number of generator cluster routes.
setting.bsp.power.minSize.name = Minimum cluster size
setting.bsp.power.minSize.description = Generators per cluster at minimum.
setting.bsp.power.fromPlayer.name = Power routes start from player
setting.bsp.power.fromPlayer.description = Off: start from the turret-facing side of each cluster.
setting.bsp.coreCount.name = Enemy cores planned
setting.bsp.coreCount.description = Plan routes to the nearest K enemy cores.
setting.bsp.cluster.dist.name = Cluster split distance
setting.bsp.cluster.dist.description = Selected units farther apart than this form separate clusters.

setting.bsp.deepReserve.name = Deep water reserve time
setting.bsp.deepReserve.description = Safety margin (seconds) added when checking survivable liquid crossings.
setting.bsp.candidateRadius.name = Goal candidate radius
setting.bsp.candidateRadius.description = Search radius for a substitute goal when the target is unreachable.
setting.bsp.heatScale.name = Heatmap intensity
setting.bsp.heatScale.description = Brightness of the risk heatmap overlay.
setting.bsp.hoverDps.name = Show cursor tile DPS
setting.bsp.hoverDps.description = List turret DPS details for the tile under the cursor in the damage window.
setting.bsp.waypointCap.name = Waypoint cap
setting.bsp.waypointCap.description = Maximum waypoints sent per route.
setting.bsp.batchEnabled.name = Batch large formations
setting.bsp.batchEnabled.description = Send commands for big formations in batches to avoid server DoS protection.
setting.bsp.batchSizeMult.name = Batch size scale
setting.bsp.batchSizeMult.description = Units per command batch.
setting.bsp.batchDelayMult.name = Batch delay scale
setting.bsp.batchDelayMult.description = Delay between command batches.
setting.bsp.idleSlow.name = Idle slowdown factor
setting.bsp.idleSlow.description = While formation, target and threats are unchanged, replan this many times slower.
setting.bsp.power.linkDist.name = Generator link distance
setting.bsp.power.linkDist.description = Generators this close belong to one cluster.
setting.bsp.power.nearTurret.name = Turret-side distance
setting.bsp.power.nearTurret.description = Infiltration start distance from the cluster towards the nearest turret.
setting.bsp.formationInflate.name = Formation inflation
setting.bsp.formationInflate.description = Treat the formation as wider when sampling threats (clearance margin).
setting.bsp.targetFromMouse.name = Goal source: cursor
setting.bsp.targetFromMouse.description = Off: use the draggable target point instead of the cursor.
setting.bsp.showTargetMarker.name = Show target point marker
setting.bsp.showTargetMarker.description = Circle + crosshair marker of the draggable target point.

setting.bsp.update.check.name = Check for updates
setting.bsp.update.check.description = Poll GitHub releases at most every 6 hours on the main menu.
setting.bsp.update.dialog.name = Update popup
setting.bsp.update.dialog.description = Off: only a light toast instead of a dialog.
setting.bsp.update.repo.name = Update repo (owner/name)
setting.bsp.update.repo.description = GitHub repository to check. Empty disables update checks.

