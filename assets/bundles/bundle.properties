bsp.settings.draw = Drawing & Windows
bsp.settings.colors = Colors (hex, 6 or 8 digits)
bsp.settings.auto = Auto & Move Commands
bsp.settings.targets = Targets & Clusters
bsp.settings.advanced = Advanced (pro mode)
bsp.settings.update = Update Check
bsp.settings.pickblock = Pick target building
bsp.settings.targetblock = Target building:
bsp.settings.noblock = (not selected)
