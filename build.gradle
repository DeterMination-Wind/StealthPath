plugins{
    id "java"
}

version = "0.0.0"
group = "bsp"

sourceSets{
    main.java.srcDirs = ["src"]
    test.java.srcDirs = ["test"]
}

repositories{
    mavenCentral()
}

java{
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = "UTF-8"
    options.release = 8
}

// Offline dependency wiring against the official Mindustry v7 (build 157)
// artifacts from the local Gradle cache — the game version this mod targets
// (minGameVersion 154). Falls back to any explicitly passed jar via -PmindustryJar.
def gradleCache = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1")

def findCached = { String groupDir, String artifact, String version ->
    def dir = new File(gradleCache, "${groupDir}/${artifact}/${version}")
    if(!dir.exists()) return null
    def out = []
    dir.eachFileRecurse { f -> if(f.name == "${artifact}-${version}.jar") out << f }
    return out.isEmpty() ? null : out[0]
}

def mindustryCoreJar = findCached("com.github.Anuken.Mindustry", "core", "v157")
def arcCoreJar = findCached("com.github.Anuken.Arc", "arc-core", "4d9760e264") // archash of v157
def explicitJar = findProperty("mindustryJar")

dependencies{
    if(explicitJar != null){
        compileOnly files(explicitJar)
    }else{
        compileOnly files(mindustryCoreJar, arcCoreJar)
    }
    testImplementation "junit:junit:4.13.2"
    testRuntimeOnly "org.hamcrest:hamcrest-core:1.3"
}

tasks.register("verifyClasspath"){
    doLast{
        if(explicitJar != null){
            if(!file(explicitJar).exists()){
                throw new GradleException("Missing Mindustry jar: ${explicitJar}")
            }
            logger.lifecycle("betterStealthPath compiling against explicit jar: {}", explicitJar)
            return
        }
        if(mindustryCoreJar == null || arcCoreJar == null){
            throw new GradleException(
                "Missing Mindustry v157 jars under ${gradleCache}. " +
                "Resolve com.github.Anuken.Mindustry:core:v157 and Arc:arc-core:4d9760e264 once, " +
                "or pass -PmindustryJar=<path>.")
        }
        logger.lifecycle("betterStealthPath compiling against Mindustry v157:")
        logger.lifecycle("  core: {}", mindustryCoreJar)
        logger.lifecycle("  arc : {}", arcCoreJar)
    }
}

compileJava.dependsOn "verifyClasspath"

// ==== Aggregated (bundled) build contract ====
// `-Pbundled=true` injects bsp/bundled.properties into the jar; the mod then
// skips its own settings category and its own update check (the aggregator owns
// both). Default is standalone mode.
def bundled = (findProperty("bundled") ?: "false").toString().equalsIgnoreCase("true")

def bundledFlagDir = layout.buildDirectory.dir("bundled-flag")

tasks.register("writeBundledFlag"){
    inputs.property "bundled", bundled
    outputs.dir(bundledFlagDir)
    doLast{
        def f = new File(bundledFlagDir.get().asFile, "bsp/bundled.properties")
        f.parentFile.mkdirs()
        f.text = "bundled=${bundled}\n"
        logger.lifecycle("betterStealthPath bundled form: {}", bundled)
    }
}

jar{
    archiveFileName = "betterStealthPath-dev.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn "writeBundledFlag"

    from(bundledFlagDir){
        include "bsp/bundled.properties"
    }
    from(projectDir){
        include "mod.json"
    }
    from("assets/"){
        include "**"
    }
}

// The Gradle Test Executor cannot bootstrap on hosts whose user directory is
// non-ASCII (worker classpath garbling), so JUnit runs in-process via JavaExec.
tasks.register("selfTest", JavaExec){
    group = "verification"
    description = "Runs the JUnit 4 suites in-process; fails the build on any failure."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "bsp.selftest.SelfTestRunner"
}

test.enabled = false
check.dependsOn "selfTest"

// ==== i18n discipline: en + zh_CN must carry the identical key set ====
tasks.register("checkBundleSync"){
    group = "verification"
    description = "Fails the build when bundle.properties and bundle_zh_CN.properties key sets differ."
    doLast{
        def keys = { File f ->
            def set = new TreeSet<String>()
            f.eachLine { line ->
                def t = line.trim()
                if(t && !t.startsWith("#")){
                    def i = t.indexOf('=')
                    if(i > 0) set << t.substring(0, i).trim()
                }
            }
            return set
        }
        def en = keys(file("assets/bundles/bundle.properties"))
        def zh = keys(file("assets/bundles/bundle_zh_CN.properties"))
        def missingZh = en - zh
        def missingEn = zh - en
        if(missingZh || missingEn){
            throw new GradleException("Bundle key mismatch. Missing in zh_CN: ${missingZh} ; missing in en: ${missingEn}")
        }
        logger.lifecycle("Bundle sync OK: {} shared keys (en and zh_CN).", en.size())
    }
}

check.dependsOn "checkBundleSync"

def devArtifactDir = new File(rootDir.parentFile, "构建/betterStealthPath")

tasks.register("copyDevJar", Copy){
    group = "build"
    description = "Copies the dev jar to the workspace 构建 output folder."
    dependsOn jar
    from(jar.archiveFile)
    into(devArtifactDir)
    rename { "betterStealthPath-dev.jar" }
    doNotTrackState("Copies dev artifact into workspace build output folder.")
}

build.dependsOn "copyDevJar"
